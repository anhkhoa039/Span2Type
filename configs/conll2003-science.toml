seed = 100
model = "ner"
save_state = "load_finetuned"
save_path = "./checkpoints/owner/conll2003/new_model"

[data]
train_dataset_path = "data/conll2003/train.json"
train_dataset_name = "conll2003"
test_dataset_path = "data/crossner/science/test.json"
test_dataset_v2_path = "data/crossner/science/science_test_converted.json"
test_dataset_name = "crossner-science"

[mention_detection]
plm_name = "microsoft/deberta-v3-base"
max_len = 256
batch_size = 32
num_epochs = 4
learning_rate = 2e-5

[entity_typing]
template = "{sentence} {entity} is a [MASK]."
plm_name = "bert-base-uncased"
max_len = 256
batch_size = 128
num_epochs = 4
learning_rate = 2e-5
k_min = 2
k_max = 30
k_step = 2
