seed = 100
model = "ner"
save_state = "load_finetuned"
save_path = "checkpoints/owner/new_model"

[data]
train_dataset_path = "data/conll2003/train.json"
train_dataset_name = "conll2003"
test_dataset_path = "data/crossner/music/test.json"
test_dataset_v2_path = "data/crossner/music/music_test_converted.json"
test_dataset_name = "crossner-music"

[mention_detection]
plm_name = "microsoft/deberta-v3-base"
max_len = 256
batch_size = 32
num_epochs = 4
learning_rate = 2e-5

[entity_typing]
template = "{sentence} {entity} is a [MASK]."
plm_name = "bert-base-uncased"
max_len = 256
batch_size = 64
num_epochs = 4
learning_rate = 1e-4
k_min = 2
k_max = 30
k_step = 2

generate_cluster_names = true
mlm_plm_name = "bert-base-uncased"
cluster_name_backends = ["mlm"]   # mlm only; set to ["mlm", "ollama"] to enable LLM backend
ollama_model_name = "llama3"
cluster_name_max_words = 3

# Multi-template voting: 4 templates for diverse BERT predictions
cluster_name_prompt_template = "{sentence} {entity} is a [MASK]."
cluster_name_prompt_templates = [
    "{sentence} {entity} is a [MASK].",
    "{entity} is a [MASK].",
    "[MASK] such as {entity}",
    "In this context, {entity} is a [MASK].",
]
cluster_name_topk_vote = 3   # soft top-k probability aggregation (1 = OWNER hard vote)

# Exemplar selection per backend (paper baseline = no MMR for either)
cluster_name_mlm_use_mmr = false    # no MMR: uses all entities (num_exemplars=-1 overrides selection)
cluster_name_ollama_use_mmr = true  # MMR for LLM: diverse exemplars from n_samples
cluster_name_mmr_lambda = 0.7
cluster_name_num_exemplars = -1     # -1 = use all cluster entities (replicates OWNER paper setting)
cluster_name_n_samples = 16       # for ollama backend (paper uses n=16)
cluster_name_seed = 100

use_soft_prompt = false
train_plm = true
num_soft_tokens = 5
dropout = 0.1